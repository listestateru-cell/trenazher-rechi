<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="scene-title scene-description">
  <title id="scene-title">Площадь после дождя</title>
  <desc id="scene-description">Небольшая площадь с цветочной лавкой. Слева стоит бирюзовый велосипед с корзиной, в центре человек в красном плаще держит жёлтый шар. Справа человек в синем читает на скамейке, рядом рыжая собака с мячом. У лавки продавец в зелёном фартуке. На площади дерево, лужа, фиолетовый чемодан и красный зонт.</desc>
